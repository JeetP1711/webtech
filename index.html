<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebTech Mastery - Semester 3 Exam Learning Hub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <span class="brand-mark">&lt;/&gt;</span>
      <div>
        <strong>WebTech Mastery</strong>
        <small>Semester 3 Hub</small>
      </div>
    </div>
    <nav id="mainNav"></nav>
    <button class="ghost-btn sidebar-toggle" id="collapseBtn" aria-label="Collapse sidebar">Collapse</button>
  </aside>

  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Open menu">☰</button>
    <div class="crumbs" id="breadcrumbs">Dashboard</div>
    <label class="search-shell">
      <span>Search</span>
      <input id="globalSearch" type="search" placeholder="Search lessons, code, questions...">
    </label>
    <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode">◐</button>
  </header>

  <main id="app" tabindex="-1"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="icon-btn close-modal" id="modalClose" aria-label="Close modal">×</button>
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/flashcards.js"></script>
  <script src="js/playground.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
